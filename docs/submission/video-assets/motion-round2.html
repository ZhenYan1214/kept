<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kept Round 2 motion scenes</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Animated scenes for the Round 2 video, 1920×1080. Every frame is a pure function of time: render-motion.js calls
     load(name, cues, D) then seek(t) for each frame, so cues land on the narration's word timings. Open
     motion-round2.html#shortfall to preview a scene in real time with its default cues. Palette follows the logo. */
  :root { --paper:#f6f5f2; --ink:#1b1f24; --muted:#646a73; --line:#e4e1db; --accent:#245b8a;
          --navy:#16222d; --card:#1f2e3b; --card2:#263746; --dline:#3a4a58; --cream:#f8f4ee; --dmuted:#b4bbc2;
          --orange:#f16646; --ok:#2c7350; --okd:#8fd0a8; --bad:#b03a2e; --badd:#ff7a86; --amber:#9a5b0c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: "Public Sans", "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .dark { background: var(--navy); color: var(--cream); --accent:#f4a58c; --ink:var(--cream); --muted:#b4bbc2; --line:#3a4a58;
          --surface:rgba(27,41,53,.76); --track:#3a4a58; --okbg:rgba(143,208,168,.14); --okfg:#8fd0a8; --badbg:rgba(255,122,134,.16); --badfg:#ff7a86;
          --ambbg:rgba(232,196,106,.16); --ambfg:#e8c46a; }
  .light { background: var(--paper); color: var(--ink); }
  .abs { position: absolute; }
  .glow { position: absolute; inset: -200px; pointer-events: none; }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }
  .kicker { position: absolute; left: 160px; top: 110px; display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .dark .kicker { color: var(--orange); }
  .src { position: absolute; left: 160px; right: 160px; bottom: 196px; font-size: 22px; color: var(--muted); }
  .dark .src { color: #8a949e; }
  h1 { font-size: 84px; line-height: 1.08; font-weight: 700; letter-spacing: -.02em; }
  .num { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.03em; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; font-size: 24px; font-weight: 600; }
  .card { background: var(--surface); border: 2px solid rgba(255,255,255,.08); border-radius: 26px; backdrop-filter: blur(14px); }
  .photo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .credit { position: absolute; right: 44px; top: 40px; font-size: 18px; color: rgba(248,244,238,.55); }
  .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="icons.js"></script>
<script>
// ---- Tiny timeline kit ---------------------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
  lin: (x) => x,
};
const P = (t, t0, d = 0.6, e = E.out) => e(clamp((t - t0) / d));
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const icon = (n, size = "1em", sw = 1.7) => `<svg class="ic" style="width:${size};height:${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const LOGO = (size) => `<svg viewBox="157 172 940 940" style="width:${size}px;height:${size}px"><rect x="157" y="172" width="940" height="940" rx="210" fill="#f8f4ee"/><g class="k1" fill="#f16646"><path fill-rule="evenodd" d="M600 280L300 448L312 520V825C312 888 357 937 418 937H780Q805 937 825 952L895 1003Q918 1018 931 993L907 927Q904 913 915 903Q941 876 941 840V520L953 448L655 280Q627 266 600 280ZM627 355L385 490V828Q385 865 422 865H830Q869 865 869 828V490Z"/><circle cx="309" cy="484" r="37"/><circle cx="945" cy="484" r="37"/></g><g fill="#1b2935"><rect class="k2" x="427" y="571" width="363" height="73" rx="36.5"/><rect class="k3" x="427" y="680" width="283" height="73" rx="36.5"/></g></svg>`;
let stage, S = {}, cur, C, D, O;
const q = (s) => stage.querySelector(s), qa = (s) => [...stage.querySelectorAll(s)];
// Entrance helpers: p in 0..1.
function rise(el, p, dy = 36) { if (!el) return; el.style.opacity = clamp(p); el.style.transform = `translateY(${(1 - p) * dy}px)`; }
function pop(el, p) { if (!el) return; el.style.opacity = clamp(p * 2.5); el.style.transform = `scale(${lerp(0.5, 1, E.back(clamp(p)))})`; }
function fade(el, p) { if (el) el.style.opacity = clamp(p); }
const html = (strings, ...v) => strings.reduce((s, x, i) => s + x + (i < v.length ? v[i] : ""), "");
function def(name, theme, D, cues, markup, seek) { S[name] = { theme, D, cues, markup, seek }; }

// Slow drifting light on dark scenes, so stills never look frozen.
function ambient(t) {
  const g = q(".glow");
  if (!g) return;
  const x1 = 30 + 8 * Math.sin(t * 0.21), y1 = 30 + 6 * Math.cos(t * 0.17), x2 = 75 + 7 * Math.cos(t * 0.13), y2 = 70 + 8 * Math.sin(t * 0.19);
  g.style.background = `radial-gradient(900px 700px at ${x1}% ${y1}%, rgba(74,92,108,.30), transparent 70%), radial-gradient(800px 600px at ${x2}% ${y2}%, rgba(241,102,70,.10), transparent 70%)`;
}
window.load = (name, cues = {}, dur, opts = {}) => {
  cur = S[name]; C = { ...cur.cues, ...cues }; D = dur || cur.D; O = opts;
  stage.className = cur.theme;
  stage.innerHTML = (cur.theme === "dark" ? `<div class="glow"></div>` : "") + cur.markup(O);
  window.seek(0);
  return document.fonts.ready.then(() => Promise.all(qa("img").map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r)))))).then(() => true);
};
window.seek = (t) => { qa(".photo").forEach((p) => (p.style.transform = `scale(${lerp(1.03, 1.12, t / D)})`)); cur.seek(t, C, D, O); ambient(t); };
window.SCENES = S;

// ---- 1 · Problem: what happened ------------------------------------------------------------------------------------
// A full-bleed photo (pushed in slowly by seek), a shade that keeps type legible, and the photo credit.
const PHOTO = (src, cls = "") => `<img class="photo ${cls}" src="photos/${src}">`;
const SHADE = (cls = "shade") => `<div class="abs ${cls}" style="inset:0;background:linear-gradient(90deg,rgba(22,34,45,.95) 0%,rgba(22,34,45,.82) 45%,rgba(22,34,45,.55) 100%),linear-gradient(0deg,rgba(22,34,45,.92) 0%,transparent 40%)"></div>`;
const CREDIT = (s) => `<div class="credit">${s}</div>`;
const FORESTRY = "Forestry and Nature Conservation Agency, MOA (government open information)";

def("mataian", "dark", 9.4, { burst: 4.2, toll: 8.1 }, () => html`
  ${PHOTO("mataian-lake.jpg", "before")}${PHOTO("guangfu-after.jpg", "after")}${SHADE()}
  ${CREDIT(`Aerial photos, 6 and 26 September 2025: ${FORESTRY}`)}
  <div class="abs stamp" style="right:160px;top:600px;width:520px;height:50px"><span class="pill d1" style="position:absolute;right:0;top:0;white-space:nowrap;background:rgba(22,34,45,.75);color:var(--cream)">6 Sep 2025 · the barrier lake</span><span class="pill d2" style="position:absolute;right:0;top:0;white-space:nowrap;background:var(--orange);color:var(--navy)">26 Sep 2025 · Guangfu, after</span></div>
  <div class="kicker">${icon("map-pin", "34px", 2)} Guangfu, Hualien, Taiwan · 23 September 2025</div>
  <h1 class="abs" style="left:160px;top:200px"><div class="l1">The Mataian barrier lake</div><div class="l2">burst into Guangfu.</div></h1>
  <div class="abs toll num" style="left:160px;top:440px;font-size:220px;line-height:1"><span class="n">0</span><span style="font-size:110px;font-weight:700;letter-spacing:-.01em"> dead</span></div>
  <div class="abs sub" style="left:166px;top:690px;font-size:46px;color:#c9d0d8">5 missing · 157 injured</div>
  <div class="src" style="color:#8f9aa6">Official count, 8 October 2025</div>`,
  (t, c) => {
    rise(q(".kicker"), P(t, 0.15)); rise(q(".l1"), P(t, 0.45, 0.8)); rise(q(".l2"), P(t, Math.min(c.burst - 0.3, 1.4), 0.8));
    const after = P(t, c.burst - 0.2, 1.0, E.io);
    q(".after").style.opacity = after; q(".shade").style.opacity = lerp(0.7, 1, P(t, c.toll - 1.2, 1.0));
    fade(q(".d1"), P(t, 0.6) * (1 - after)); fade(q(".d2"), after);
    const p = P(t, c.toll - 0.15, 0.5); rise(q(".toll"), p, 50);
    q(".toll .n").textContent = Math.round(19 * P(t, c.toll - 0.1, 0.9));
    rise(q(".sub"), P(t, c.toll + 0.7)); fade(q(".src"), P(t, 0.8));
  });

// ---- 1 · Problem: still waiting ------------------------------------------------------------------------------------
def("shortfall", "dark", 26.4, { fridge: 4.0, washer: 8.5, money: 11.6, unspent: 14.7, voice: 18.0, reached: 20.6, before: 23.5 }, () => html`
  ${PHOTO("guangfu-after.jpg", "bg")}<div class="abs" style="inset:0;background:rgba(22,34,45,.72)"></div>${SHADE()}${PHOTO("hualien-uranus.jpg", "next")}
  <div class="cr1">${CREDIT(`Guangfu, 26 September 2025: ${FORESTRY}`)}</div>
  <div class="cr2">${CREDIT("Hualien City, 3 April 2024. Photo: Shufu Liu, Office of the President (CC BY 2.0)")}</div>
  <div class="main">
    <div class="kicker">${icon("file-text", "34px", 2)} Six months later · the Guangfu township's needs list</div>
    <div class="abs" style="left:160px;top:200px;display:grid;grid-template-columns:repeat(3,500px);gap:50px">
      ${[["refrigerator", "households still<br>waiting for a fridge", 319], ["washing-machine", "still waiting for a<br>washing machine", 111], ["cooking-pot", "still waiting for a<br>gas stove", 41]].map(([ic, l, n], i) => `
      <div class="card c${i}" style="padding:36px 40px;min-height:340px">
        <div style="color:var(--orange)">${icon(ic, "84px", 1.5)}</div>
        <div class="num n" data-n="${n}" style="font-size:120px;line-height:1.05;margin-top:14px">0</div>
        <div style="font-size:28px;color:var(--dmuted);margin-top:6px;line-height:1.3">${l}</div></div>`).join("")}
    </div>
    <div class="abs budget" style="left:160px;top:590px;width:1600px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:32px;color:var(--dmuted)"><span>Set aside for these large appliances</span><b class="num" style="font-size:44px;color:var(--cream)">NT$7.86M</b></div>
      <div style="position:relative;height:30px;margin-top:16px">
        <div class="track" style="position:absolute;inset:0;border:3px dashed #4a5a68;border-radius:15px;transform-origin:left"></div>
        <div class="stub" style="position:absolute;left:0;top:-10px;width:10px;height:50px;border-radius:5px;background:var(--orange)"></div>
      </div>
      <div class="spent" style="margin-top:18px;font-size:34px">Spent by 31 August 2026: <b class="num" style="color:var(--orange);font-size:48px">NT$0</b></div>
    </div>
  </div>
  <div class="abs bubble" style="left:460px;top:300px;width:1000px;display:flex;flex-direction:column;align-items:center">
    <div style="position:relative;background:var(--cream);color:var(--navy);border-radius:40px;padding:50px 70px;font-size:76px;font-weight:700;letter-spacing:-.01em;white-space:nowrap">
      <span class="q"></span><span class="caret" style="display:inline-block;width:6px;height:70px;background:var(--orange);vertical-align:-8px;margin-left:6px"></span>
      <div style="position:absolute;left:120px;bottom:-34px;width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:36px solid var(--cream)"></div>
    </div>
    <div class="bsub" style="margin-top:70px;font-size:36px;color:var(--dmuted);display:flex;gap:14px;align-items:center">${icon("eye-off", "40px")} No public place to say it</div>
  </div>
  <div class="abs before" style="left:0;right:0;top:340px;text-align:center">
    <div style="color:var(--orange)">${icon("map-pin", "90px", 1.6)}</div>
    <div style="font-size:96px;font-weight:700;letter-spacing:-.02em;margin-top:20px">Hualien, 2024</div>
  </div>
  <div class="src">Hualien County donation committee, written review dated 30 March 2026 (township needs roster); county donation-account statement as of 31 August 2026</div>`,
  (t, c) => {
    rise(q(".kicker"), P(t, 0.1));
    const at = [c.fridge - 0.3, c.washer - 0.3, c.washer + 0.5];
    qa(".card").forEach((el, i) => {
      rise(el, P(t, at[i], 0.6), 60);
      const n = q(`.c${i} .n`); n.textContent = fmt(n.dataset.n * P(t, at[i] + 0.2, i === 0 ? 1.6 : 1.1));
    });
    const b = P(t, c.money - 0.3, 0.6); rise(q(".budget"), b);
    q(".track").style.transform = `scaleX(${P(t, c.money - 0.1, 1.2, E.io)})`;
    rise(q(".spent"), P(t, c.unspent - 0.2));
    const blink = t > c.unspent ? 0.45 + 0.55 * Math.abs(Math.cos((t - c.unspent) * 2.4)) : 1;
    q(".stub").style.opacity = P(t, c.unspent - 0.2) * blink;
    // The household's voice, with nowhere to go.
    const v = P(t, c.voice - 0.2, 0.7), gone = P(t, c.before - 0.3, 0.5);
    q(".main").style.opacity = lerp(1, 0.14, v) * (1 - gone);
    q(".bg").style.opacity = 1 - 0.6 * gone;
    const nx = P(t, c.before - 0.2, 1.0, E.io); q(".next").style.opacity = 0.4 * nx; fade(q(".cr1"), 1 - nx); fade(q(".cr2"), nx);
    q(".main").style.filter = `blur(${4 * v}px)`;
    pop(q(".bubble"), P(t, c.voice, 0.7, E.lin)); q(".bubble").style.opacity = Math.min(q(".bubble").style.opacity, 1 - gone);
    const msg = "“It has not reached us.”";
    q(".q").textContent = msg.slice(0, Math.round(msg.length * P(t, c.reached - 0.3, 1.3, E.lin)));
    q(".caret").style.opacity = t < c.reached + 1.2 ? (Math.floor(t * 2.5) % 2 ? 0.15 : 1) : 0;
    rise(q(".bsub"), P(t, c.voice + 0.8));
    q(".bsub").style.opacity = Math.min(q(".bsub").style.opacity, 1 - gone);
    rise(q(".before"), P(t, c.before, 0.8), 50);
    fade(q(".src"), P(t, 0.6) * (1 - gone));
  });

// ---- 1 · Problem: Hualien 2024 -------------------------------------------------------------------------------------
def("hualien", "dark", 31.3, { donated: 3.6, eleven: 8.1, sixteen: 10.0, committee: 13.5, after: 17.3, national: 21.7, twice: 24.1, people: 25.6, they: 28.0 }, () => html`
  ${PHOTO("hualien-uranus.jpg")}${SHADE()}
  ${CREDIT("Hualien City, 3 April 2024. Photo: Shufu Liu, Office of the President (CC BY 2.0)")}
  <div class="kicker">${icon("map-pin", "34px", 2)} Hualien, Taiwan · 2024 earthquake</div>
  <div class="abs pa" style="left:160px;top:210px;width:1600px">
    <div class="r1" style="display:flex;align-items:center;gap:40px;height:150px">
      <div style="color:var(--accent)">${icon("hand-coins", "92px", 1.5)}</div>
      <div class="num" style="font-size:110px;color:var(--accent);min-width:520px">NT$<span class="n">0</span>M</div>
      <div style="font-size:46px">donated to the county</div></div>
    <div class="r2" style="display:flex;align-items:center;gap:40px;height:170px">
      <div style="color:var(--accent)">${icon("hourglass", "92px", 1.5)}</div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:44px"><span>paid out after 11 months</span><b class="num pct" style="font-size:100px;color:var(--accent)">0%</b></div>
        <div style="height:30px;border-radius:15px;background:var(--track);margin-top:12px;overflow:hidden"><div class="fill" style="height:100%;width:0;background:var(--accent);border-radius:15px"></div></div>
      </div></div>
    <div class="r3" style="display:flex;align-items:center;gap:40px;height:150px">
      <div style="color:var(--accent)">${icon("users", "92px", 1.5)}</div>
      <div class="num zero" style="font-size:110px;color:var(--orange);min-width:110px">0</div>
      <div style="font-size:46px">affected households on its committee</div></div>
  </div>
  <div class="abs pb" style="left:160px;top:200px;width:1600px">
    ${[["Hualien County", "NT$792M", 792, "b1"], ["National relief foundation", "NT$1.65bn", 1650, "b2"]].map(([l, v, n, k]) => `
    <div style="display:flex;align-items:center;gap:30px;height:120px">
      <div style="width:470px;font-size:40px;font-weight:600">${l}</div>
      <div class="${k}" style="height:76px;border-radius:14px;background:${k === "b1" ? "#56636f" : "var(--accent)"};width:${(n / 1650) * 900}px;transform-origin:left;display:flex;align-items:center;justify-content:flex-end;padding-right:22px">
        <span class="num" style="font-size:38px;color:${k === "b1" ? "var(--cream)" : "var(--navy)"};font-weight:700">${v}</span></div>
      ${k === "b2" ? `<div class="x2 num" style="font-size:72px;color:var(--orange)">≈ 2×</div>` : ""}
    </div>`).join("")}
    <h1 style="margin-top:70px;font-size:80px"><div class="t1">People did not stop giving.</div><div class="t2">They stopped <span style="position:relative;color:var(--accent)">trusting<span class="ul" style="position:absolute;left:0;right:0;bottom:-4px;height:8px;border-radius:4px;background:var(--orange);transform-origin:left"></span></span> where it goes.</div></h1>
  </div>
  <div class="src s1">Hualien County donation committee, papers for its 24 March 2025 meeting, appendix B (figures to 27 February 2025) · PTS, 31 March 2025</div>
  <div class="src s2">NT$1.65bn to the national relief foundation, NT$792M to the county; attributed to disputes over 2018 donations · LTN, 30 March 2025</div>`,
  (t, c) => {
    rise(q(".kicker"), P(t, 0.1));
    q(".shade").style.opacity = lerp(0.55, 1, P(t, c.donated - 1.0, 1.2));
    const out = P(t, c.after - 0.4, 0.6);
    q(".pa").style.opacity = 1 - out; q(".pa").style.transform = `translateY(${-40 * out}px)`;
    rise(q(".r1"), P(t, c.donated - 0.6)); q(".r1 .n").textContent = fmt(792 * P(t, c.donated - 0.3, 1.4));
    rise(q(".r2"), P(t, c.eleven - 0.4));
    const f = P(t, c.sixteen - 0.2, 1.1); q(".fill").style.width = `${16 * f}%`; q(".pct").textContent = `${Math.round(16 * f)}%`;
    rise(q(".r3"), P(t, c.committee - 0.4)); pop(q(".zero"), P(t, c.committee + 0.9, 0.6, E.lin));
    fade(q(".s1"), P(t, 0.6) * (1 - out)); fade(q(".s2"), P(t, c.after));
    q(".pb").style.opacity = P(t, c.after - 0.1, 0.5);
    q(".b1").style.transform = `scaleX(${P(t, c.after, 0.9, E.io)})`;
    q(".b2").style.transform = `scaleX(${P(t, c.national - 0.3, 1.3, E.io)})`;
    q(".b1 span").style.opacity = P(t, c.after + 0.6); q(".b2 span").style.opacity = P(t, c.national + 0.8);
    pop(q(".x2"), P(t, c.twice - 0.2, 0.6, E.lin));
    rise(q(".t1"), P(t, c.people - 0.3)); rise(q(".t2"), P(t, c.they - 0.3));
    q(".ul").style.transform = `scaleX(${P(t, c.they + 0.6, 0.7)})`;
  });

// ---- 1 · Problem: the foundation's own disclosures -----------------------------------------------------------------
def("foundation", "dark", 42.4, { publishes: 2.2, paid: 6.3, prealloc: 9.8, ministry: 13.2, eleven: 16.0, eight: 18.0, notone: 18.6, normal: 25.0, after: 32.2, households: 36.4 }, () => html`
  ${PHOTO("guangfu-levee.jpg")}<div class="abs" style="inset:0;background:rgba(22,34,45,.8)"></div>${SHADE()}
  ${CREDIT(`Mataian Creek, 26 September 2025: ${FORESTRY}`)}
  <div class="kicker">${icon("file-check", "34px", 2)} Guangfu 2025 · the foundation's own disclosures <span class="pill" style="background:var(--okbg);color:var(--okfg);letter-spacing:0;text-transform:none;margin-left:10px">● Real data</span></div>
  <div class="abs pa" style="left:160px;top:200px;width:1600px;height:620px">
    <svg class="abs" style="left:0;top:20px" width="500" height="500" viewBox="0 0 500 500">
      <circle cx="250" cy="250" r="200" fill="none" stroke="#3a4a58" stroke-width="44"/>
      <circle class="arc" cx="250" cy="250" r="200" fill="none" stroke="#c4955a" stroke-width="44" stroke-dasharray="1256.6" stroke-dashoffset="1256.6" transform="rotate(-90 250 250)"/>
    </svg>
    <div class="abs" style="left:0;top:20px;width:500px;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:30px;color:var(--muted)">paid out</div>
      <div class="num paid" style="font-size:70px">NT$0.00bn</div>
