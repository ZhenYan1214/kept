[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
libraries = ["node_modules/poseidon-solidity/PoseidonT3.sol:PoseidonT3:0x3333333C0A88F9BE4fd23ed0536F9B6c427e3B93"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@semaphore-protocol/contracts/=node_modules/@semaphore-protocol/contracts/",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
]

[invariant]
# Random call sequences against the fund and the custody ledger (test/Invariants.t.sol).
runs = 256
depth = 50
fail_on_revert = true

[fmt]
line_length = 110

[lint]
lint_on_build = false
